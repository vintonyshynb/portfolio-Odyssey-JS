<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="img/star_wars.jpg" type="image/x-icon">
    <title>Odyssey-JS</title>
</head>

<body>
    <div id="ui">
        <h1>Odyssey JS</h1>
        <div id="score">
            Score: 0
        </div>
        <div id="bestScore">
            Best Score: 0
        </div>
        <div id="gameMode">
            Mode
        </div>
        <div id="gameMode"></div>
        <div id="gameOver">
            GAME OVER
            <br>
            Press R to restart
        </div>
        <div id="fps">
            FPS: 0
        </div>
    </div>
    <div id="startScreen">
        <h1>Odyssey JS</h1>
        <p>Press ENTER to Start</p>
        <p>1 - Space Runner</p>
        <p>2 - Space Invader</p>
        <p>Mouse: Shoot</p>
    </div>
    <div id="effectsHUD"></div>
    <div id="pauseScreen">
        PAUSED
    </div>
    <script type="module" src="main.js"></script>
</body>

</html>
